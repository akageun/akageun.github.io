<nav class="blog-pagination" aria-label="글 목록 페이지">
    {% if paginator.previous_page %}
    <a class="btn btn-outline-primary rounded-pill"
       href="{{ paginator.previous_page_path | prepend: site.baseurl | replace: '//', '/' }}">← 이전 페이지</a>
    {% endif %}

    {% if paginator.next_page %}
    <a class="btn btn-primary rounded-pill"
       href="{{ paginator.next_page_path | prepend: site.baseurl | replace: '//', '/' }}">다음 페이지 →</a>
    {% endif %}
</nav>
